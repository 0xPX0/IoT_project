# MQTT sur TLS
listener 8883
protocol mqtt

# Certificat du serveur et autorité de confiance
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key

# Certificat client obligatoire
require_certificate true
use_identity_as_username true
allow_anonymous false

# Autorisations MQTT
acl_file /mosquitto/config/acl

# Pas de persistance pour cette première version
persistence false

# Journaux accessibles avec docker compose logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true